<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pv-token" content="__TOKEN__">
<meta name="color-scheme" content="light dark">
<title>Kamroll</title>
<link rel="stylesheet" href="/static/app.css">
<script>
  // Apply the saved theme and the desktop flags before first paint so there is no flash.
  try { var t = localStorage.getItem("pv-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try {
    var d = new URLSearchParams(location.search).get("desktop");
    if (d) { sessionStorage.setItem("pv-desktop", d); }
    d = d || sessionStorage.getItem("pv-desktop");
    if (d) { document.documentElement.classList.add("desktop", d); }
  } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-memory" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4.5" width="12" height="9" rx="2"/><path d="M5.5 4.5 6.5 2.5h3l1 2"/><circle cx="8" cy="9" r="2.2"/></symbol>
  <symbol id="g-trip" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14s-4.5-4-4.5-7.5a4.5 4.5 0 0 1 9 0C12.5 10 8 14 8 14z"/><circle cx="8" cy="6.5" r="1.5"/></symbol>
  <symbol id="g-screenshot" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="1.75" width="8" height="12.5" rx="2"/><path d="M7 11.75h2"/></symbol>
  <symbol id="g-social" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4a1.5 1.5 0 0 1 1.5-1.5h8A1.5 1.5 0 0 1 13.5 4v5a1.5 1.5 0 0 1-1.5 1.5H7L4 13.5v-3A1.5 1.5 0 0 1 2.5 9z"/></symbol>
  <symbol id="g-junk" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.5 9h6l.5-9"/></symbol>
  <symbol id="g-duplicate" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M5.5 5.5V4A1.5 1.5 0 0 1 7 2.5h5A1.5 1.5 0 0 1 13.5 4v5a1.5 1.5 0 0 1-1.5 1.5h-1.5"/></symbol>
  <symbol id="g-document" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h5l3 3v8H4z"/><path d="M9 2.5v3h3M6 8.5h4M6 11h4"/></symbol>
  <symbol id="g-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></symbol>
</svg>
<div class="titlebar" data-tauri-drag-region></div>
<div class="app">
  <aside class="side" aria-label="Main">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" class="brand-bg"/><circle cx="16" cy="16" r="7.5" fill="none" class="brand-fg" stroke-width="2.4"/><circle cx="16" cy="16" r="2.6" class="brand-dot"/></svg>
      <div><div class="brand-name">Kamroll</div><div class="brand-sub">iPhone to SSD</div></div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="conn" id="conn" aria-live="polite"></div>
    <div class="side-foot">Read-only on the iPhone. Originals are never converted.</div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <header class="top">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme" title="Switch colour theme"></button>
    </header>
    <div id="page"></div>
  </main>
</div>

<dialog id="folderDialog" aria-labelledby="fdTitle">
  <form method="dialog" class="fd">
    <div class="fd-head"><h2 id="fdTitle">Choose a folder</h2><button class="icon-btn" value="cancel" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="fd-path"><button type="button" class="btn small" id="fdUp">Up</button><code id="fdCurrent"></code></div>
    <ul class="fd-list" id="fdList"></ul>
    <div class="fd-foot"><span class="muted" id="fdHint"></span><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="fdPick" value="ok" type="button">Use this folder</button></div>
  </form>
</dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
