[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iphone-photo-vault"
version = "0.1.0"
description = "Crash-safe, original-quality backup of an iPhone camera roll to an external SSD (Windows + macOS)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pymobiledevice3>=4", "Pillow", "pillow-heif", "fastapi", "uvicorn", "psutil", "av", "geonamescache"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx"]

[project.scripts]
photovault = "photovault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photovault"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
