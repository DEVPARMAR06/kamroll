[package]
name = "kamroll-engine"
version = "0.1.0"
edition = "2021"
description = "The Kamroll engine: backs up an iPhone to an SSD, serves the app UI on 127.0.0.1, and has a command line."

[lib]
name = "kamroll_engine"

[features]
default = ["web"]
# A loopback web server (`kamroll-engine ui`) for development and the contract tests. The desktop app turns it off.
web = ["axum/tokio", "axum/http1", "tokio/net"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
tower = { version = "0.5", features = ["util"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
plist = "1"
base64 = "0.22"
regex = "1"
ureq = { version = "2", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
