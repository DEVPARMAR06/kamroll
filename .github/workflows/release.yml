name: release

# Builds the Windows installer and the macOS app. Run it by hand (Actions, Run workflow) to get the files as
# downloadable artifacts for testing, or push a tag such as v0.1.0 to also create a draft GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: build:win
          - os: macos-latest
            name: macos
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the app
        working-directory: desktop
        run: |
          npm install
          npm run ${{ matrix.script }}

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p dist
          find desktop/src-tauri/target -path "*bundle*" \( -name "*.exe" -o -name "*.dmg" \) -not -path "*/deps/*" -exec cp {} dist/ \;
          cd dist && (sha256sum * 2>/dev/null || shasum -a 256 *) > "SHA256SUMS-${{ matrix.name }}.txt"; ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: kamroll-${{ matrix.name }}
          path: dist/*

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
