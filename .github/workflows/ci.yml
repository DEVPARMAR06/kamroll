name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e "reference[dev]"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Rust engine
        working-directory: engine
        run: |
          cargo build
          cargo test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: UI syntax
        run: node --check ui/app.js
      - name: Contract and engine tests
        run: python -m pytest -q
