name: desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
          - os: macos-latest        # Apple silicon
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle the engine
        shell: bash
        run: |
          python -m pip install -e ".[dev]" pyinstaller
          python -m pytest -q
          pyinstaller --noconfirm --clean --onedir --name photovault-engine \
            --distpath desktop/engine-dist --workpath desktop/engine-build --specpath desktop/engine-build \
            --paths "$PWD/src" --add-data "$PWD/src/photovault/ui${{ matrix.sep }}photovault/ui" \
            --collect-all pymobiledevice3 --collect-all geonamescache --collect-all pillow_heif --collect-all av \
            --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules starlette --collect-submodules photovault \
            --hidden-import psutil --hidden-import PIL.Image \
            desktop/engine_entry.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the desktop app
        working-directory: desktop
        run: |
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: photo-vault-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
