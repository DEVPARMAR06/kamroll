name: desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: ".exe"
            script: build:win
          - os: macos-latest        # Apple silicon
            exe: ""
            script: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build the engine
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          (cd engine-rs && cargo build)
          python -m pytest -q
          (cd engine-rs && cargo build --release)
          mkdir -p desktop/engine-dist/photovault-engine
          cp engine-rs/target/release/photovault-engine${{ matrix.exe }} desktop/engine-dist/photovault-engine/

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the desktop app
        working-directory: desktop
        run: |
          npm install
          npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: photo-vault-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.dmg
