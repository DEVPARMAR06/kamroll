<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pv-token" content="__TOKEN__">
<meta name="color-scheme" content="light dark">
<title>Photo Vault</title>
<link rel="stylesheet" href="/static/app.css">
<script>
  // Apply the saved theme and the desktop flags before first paint so there is no flash.
  try { var t = localStorage.getItem("pv-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try {
    var d = new URLSearchParams(location.search).get("desktop");
    if (d) { sessionStorage.setItem("pv-desktop", d); }
    d = d || sessionStorage.getItem("pv-desktop");
    if (d) { document.documentElement.classList.add("desktop", d); }
  } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-memory" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="currentColor"/></symbol>
  <symbol id="g-trip" viewBox="0 0 16 16"><path d="M8 1.5c-2.8 0-5 2.1-5 4.8C3 10 8 14.5 8 14.5s5-4.5 5-8.2c0-2.7-2.2-4.8-5-4.8z" fill="currentColor"/><circle cx="8" cy="6.3" r="1.8" fill="var(--panel)"/></symbol>
  <symbol id="g-screenshot" viewBox="0 0 16 16"><rect x="3.5" y="1.5" width="9" height="13" rx="1.8" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="g-social" viewBox="0 0 16 16"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6a1.5 1.5 0 0 1-1.5 1.5H7l-3.5 3v-3A1.5 1.5 0 0 1 2 9.5z" fill="currentColor"/></symbol>
  <symbol id="g-junk" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="g-duplicate" viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5.5" y="1.5" width="9" height="9" rx="1.5" fill="var(--panel)" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="g-document" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="g-check" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div class="titlebar" data-tauri-drag-region></div>
<div class="app">
  <aside class="side" aria-label="Main">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" class="brand-bg"/><circle cx="16" cy="16" r="7.5" fill="none" class="brand-fg" stroke-width="2.4"/><circle cx="16" cy="16" r="2.6" class="brand-dot"/></svg>
      <div><div class="brand-name">Photo Vault</div><div class="brand-sub">iPhone to SSD</div></div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="conn" id="conn" aria-live="polite"></div>
    <div class="side-foot">Read-only on the iPhone. Originals are never converted.</div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <header class="top">
      <div>
        <h1 id="title"></h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme" title="Switch colour theme"></button>
    </header>
    <div id="page"></div>
  </main>
</div>

<dialog id="folderDialog" aria-labelledby="fdTitle">
  <form method="dialog" class="fd">
    <div class="fd-head"><h2 id="fdTitle">Choose a folder</h2><button class="icon-btn" value="cancel" aria-label="Close">&times;</button></div>
    <div class="fd-path"><button type="button" class="btn small" id="fdUp">Up</button><code id="fdCurrent"></code></div>
    <ul class="fd-list" id="fdList"></ul>
    <div class="fd-foot"><span class="muted" id="fdHint"></span><button class="btn" value="cancel">Cancel</button><button class="btn primary" id="fdPick" value="ok" type="button">Use this folder</button></div>
  </form>
</dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
