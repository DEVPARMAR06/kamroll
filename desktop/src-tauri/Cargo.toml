[package]
name = "kamroll"
version = "0.1.0"
description = "Kamroll desktop app: the engine and its window in one program"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# The engine runs inside the app; its development web server is left out.
kamroll-engine = { path = "../../engine", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
