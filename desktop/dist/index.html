<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Vault</title>
<style>
  :root{--bg:#EDEFE9;--ink:#171B18;--muted:#566058;--accent:#B3770A;--bad:#AE3F37}
  @media (prefers-color-scheme:dark){:root{--bg:#111412;--ink:#E9ECE5;--muted:#9BA39B;--accent:#E2AD48;--bad:#E58C82}}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;display:grid;place-items:center}
  main{text-align:center;max-width:460px;padding:24px}
  h1{font-size:20px;margin:18px 0 6px;font-weight:650;letter-spacing:-.01em}
  p{margin:0;color:var(--muted)}
  .ring{width:44px;height:44px;border-radius:50%;border:4px solid var(--muted);border-top-color:var(--accent);margin:0 auto;animation:s .9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .err h1{color:var(--bad)} .err .ring{display:none}
  code{background:rgba(127,127,127,.15);padding:1px 6px;border-radius:5px}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<main id="m"><div class="ring"></div><h1 id="t">Starting Photo Vault</h1><p id="d">Getting the engine ready…</p></main>
<script>
  // The desktop shell calls this if the engine cannot start.
  window.showError = function (message) {
    document.getElementById("m").className = "err";
    document.getElementById("t").textContent = "Photo Vault could not start";
    document.getElementById("d").innerHTML = "";
    document.getElementById("d").textContent = message;
  };
</script>
</body>
</html>
