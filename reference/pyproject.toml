[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kamroll-reference-engine"
version = "0.1.0"
description = "Python reference engine for Kamroll. The tests compare the Rust engine against it."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pymobiledevice3>=4", "Pillow", "pillow-heif", "fastapi", "uvicorn", "psutil", "av", "geonamescache"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx", "requests"]

[project.scripts]
photovault = "photovault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photovault"]
